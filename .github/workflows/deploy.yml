name: Deploy to Linode Object Storage

on:
  push:
    branches:
      - website

jobs:
  deploy:
    environment: prod
    name: Sync to Object Storage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website branch
        uses: actions/checkout@v4

      - name: Sync files to Linode Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_KEY }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          BUCKET_ENDPOINT: ${{ secrets.BUCKET_ENDPOINT }}
        run: |
          aws s3 sync . s3://${{ env.BUCKET_NAME }}/ \
            --endpoint-url=${{ env.BUCKET_ENDPOINT }} \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.py" \
            --exclude "node_modules/*" \
            --exclude "vendor/optimize_imgs.py" \
            --exclude "vendor/README.md" \
            --exclude ".env/*" \
            --cache-control "public, max-age=3600" \
            --no-progress

      # Images and fonts rarely change — cache them longer
      - name: Set long cache on static assets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUCKET_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUCKET_SECRET_KEY }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
          BUCKET_ENDPOINT: ${{ secrets.BUCKET_ENDPOINT }}
        run: |
          aws s3 sync assets/ s3://${{ env.BUCKET_NAME }}/assets/ \
            --endpoint-url ${{ env.BUCKET_ENDPOINT }} \
            --cache-control "public, max-age=2592000, immutable" \
            --no-progress
